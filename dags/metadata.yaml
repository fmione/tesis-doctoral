experiment:
  run_id: 623
  horizon: 16 
  horizon_unit: "h"
  time_btw_samplings: 0.33
  time_btw_samplings_unit: "h"
  delay_in_analytics: 1 
  delay_in_analytics_unit: "h"

objective:
  name: "Maximize biomass"
  description: "Obtain the maximum biomass at the end of the experiment without exceeding the 20% constraint for DOT"

responsible: 
  -
    name: "Person1"
    rol: "laboratory_experimentation"
  -
    name: "Person2"
    rol: "computational_algorithms"
  -
    name: "Person3"
    rol: "workflow_definition"

mbrs_groups:
  group1:
    exp_ids: [19419,19420,19427,19428,19435,19436]
    strain: "BL21(DE3)"
    plasmid: "PET28-NMB2-mEFGFP-TEVrec-(V2y)15-His"
    computational_method: 
      estimation: 
        name: "Variational Bayesian Analysis Toolbox"
        model:
          name: "Anane2017"
     
  group2: 
    exp_ids: [19421,19422,19429,19430,19437,19438]
    strain: "BL21(DE3)"
    plasmid: "PET28-NMB2-mEFGFP-TEVrec-(V2y)15-His"
    computational_method: 
      estimation: 
        name: "Variational Bayesian Analysis Toolbox"
        model:
          name: "Anane2017"

  group3: 
    exp_ids: [19423,19424,19431,19432,19439,19440]
    strain: "BL21(DE3)"
    plasmid: "PET28-NMB2-mEFGFP-TEVrec-(V2y)15-His"
    computational_method: 
      estimation: 
        name: "Variational Bayesian Analysis Toolbox"
        model:
          name: "Anane2017"

  group4: 
    exp_ids: [19425,19426,19433,19434,19441,19442]
    strain: "BL21(DE3)"
    plasmid: "PET28-NMB2-mEFGFP-TEVrec-(V2y)15-His"
    computational_method: 
      optimization: 
        name: "Mu_set reference"

feeding_config:
  feeding_start: 5.1667
  feeding_start_unit: "h"
  feeding_stop: 13.167
  feeding_stop_unit: "h"
  feeding_frequency: 0.167 
  feeding_frequency_unit: "h"
  minimal_feed_volume: 5
  minimal_feed_volume_unit: "µL"
  maximal_feed_volume: 150 
  maximal_feed_volume_unit: "µL"
  increment_cumulative_feed_volume: 5
  increment_feed_volume_unit: "µL"
  glc_feed_concentration: 200.0
  glc_feed_concentration_unit: "g/L"
  exponential_lower_bound : 14 
  exponential_upper_bound : 58
  bounds_unit: "µL"

induction_config:
  induction_start: 10.167
  induction_start_unit: "h"
  induction: 0.5
  induction_unit: "mM"
  induction_stock_solution : 500
  induction_stock_solution_unit : "mM"

computational_workflow_definition:
  iterations: 15
  time_bw_samples: 60
  time_first_sample: 72
  time_to_process_sample: 60
  time_bw_check_db: 10
  time_start_checking_db: 60
  time_units: "m"

mbrs_config:
  stirring_speed: 2600
  stirring_speed_unit: "rpm"
  aeration: 5.0
  aeration_type: "Air"
  aeration_unit: "nL/min"

computational_method:
  -
    name: "Variational Bayesian Analysis Toolbox"
    language: "Matlab"
    package: "VBA"
    url: "https://mbb-team.github.io/VBA-toolbox/"
  -
    name: "Mu_set reference"
    language: "None"
    package: "Reference"
    url: "None"

model:
  -
    name: "Anane2017"
    authors: "Anane, E., López C, D. C., Neubauer, P., & Cruz Bournazou, M. N. "
    description: "Modelling overflow metabolism in Escherichia coli by acetate cycling"
    doi: "https://doi.org/10.1016/j.bej.2017.05.013"